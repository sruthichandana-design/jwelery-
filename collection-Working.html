<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collection - SERENE (Working Cart)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --soft-beige: #F4F1EA;
            --warm-grey: #8B8B8B;
            --charcoal: #3A3A3A;
            --muted-gold: #C9A961;
            --cream: #FDFBF7;
            --sage: #B4C4AE;
            --light-border: #E5E1D8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--cream);
            color: var(--charcoal);
            line-height: 1.7;
            overflow-x: hidden;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(253, 251, 247, 0.95);
            backdrop-filter: blur(8px);
            z-index: 1000;
            padding: 1.3rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--light-border);
        }

        .logo {
            font-family: 'Lora', serif;
            font-size: 1.6rem;
            font-weight: 500;
            letter-spacing: 2px;
            color: var(--charcoal);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2.5rem;
            align-items: center;
        }

        .nav-links a {
            color: var(--charcoal);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--muted-gold);
        }

        .cart-icon {
            position: relative;
            cursor: pointer;
            font-size: 1.3rem;
            transition: transform 0.2s ease;
        }

        .cart-icon:hover {
            transform: translateY(-2px);
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--muted-gold);
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 500;
        }

        /* Collection Grid */
        .collection {
            padding: 8rem 5% 5rem 5%;
            background: var(--cream);
            min-height: 100vh;
        }

        .section-title {
            font-family: 'Lora', serif;
            font-size: 2.8rem;
            font-weight: 500;
            text-align: center;
            margin-bottom: 0.8rem;
            letter-spacing: 2px;
            color: var(--charcoal);
        }

        .section-subtitle {
            text-align: center;
            color: var(--warm-grey);
            font-size: 1rem;
            margin-bottom: 4rem;
            font-weight: 300;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2.5rem;
            max-width: 1300px;
            margin: 0 auto;
        }

        .product-card {
            background: white;
            overflow: hidden;
            transition: all 0.3s ease;
            border: 1px solid var(--light-border);
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
        }

        .product-image {
            width: 100%;
            height: 380px;
            background: var(--soft-beige);
            position: relative;
            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card:hover .product-image img {
            transform: scale(1.05);
        }

        .product-info {
            padding: 1.8rem;
            text-align: center;
        }

        .product-name {
            font-family: 'Lora', serif;
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--charcoal);
        }

        .product-category {
            color: var(--warm-grey);
            font-size: 0.85rem;
            letter-spacing: 1px;
            margin-bottom: 1rem;
            font-weight: 300;
        }

        .product-price {
            font-size: 1.2rem;
            color: var(--muted-gold);
            margin-bottom: 1.5rem;
            font-weight: 500;
        }

        .add-to-cart-btn {
            width: 100%;
            padding: 0.9rem;
            background: var(--charcoal);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
        }

        .add-to-cart-btn:hover {
            background: var(--muted-gold);
        }

        .add-to-cart-btn:active {
            transform: scale(0.98);
        }

        /* Cart Sidebar */
        .cart-sidebar {
            position: fixed;
            right: -420px;
            top: 0;
            width: 420px;
            height: 100vh;
            background: white;
            box-shadow: -5px 0 25px rgba(0, 0, 0, 0.1);
            z-index: 2000;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .cart-sidebar.open {
            right: 0;
        }

        .cart-header {
            padding: 1.8rem 2rem;
            border-bottom: 1px solid var(--light-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--soft-beige);
        }

        .cart-header h2 {
            font-family: 'Lora', serif;
            font-size: 1.6rem;
            font-weight: 500;
            color: var(--charcoal);
        }

        .close-cart {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--warm-grey);
            transition: color 0.3s ease;
        }

        .close-cart:hover {
            color: var(--charcoal);
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
        }

        .cart-item {
            display: flex;
            gap: 1.2rem;
            padding: 1.2rem 0;
            border-bottom: 1px solid var(--light-border);
        }

        .cart-item-image {
            width: 75px;
            height: 75px;
            background: var(--soft-beige);
            flex-shrink: 0;
        }

        .cart-item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cart-item-details {
            flex: 1;
        }

        .cart-item-name {
            font-weight: 500;
            margin-bottom: 0.4rem;
            color: var(--charcoal);
            font-size: 0.95rem;
        }

        .cart-item-price {
            color: var(--muted-gold);
            font-size: 1rem;
            margin-bottom: 0.4rem;
        }

        .remove-item {
            background: none;
            border: none;
            color: var(--warm-grey);
            cursor: pointer;
            font-size: 0.8rem;
            text-decoration: underline;
            transition: color 0.3s ease;
        }

        .remove-item:hover {
            color: var(--charcoal);
        }

        .cart-footer {
            padding: 2rem;
            border-top: 1px solid var(--light-border);
            background: var(--soft-beige);
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            font-size: 1.3rem;
            font-weight: 500;
            color: var(--charcoal);
        }

        .checkout-btn {
            width: 100%;
            padding: 1.1rem;
            background: var(--charcoal);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
        }

        .checkout-btn:hover {
            background: var(--muted-gold);
        }

        .empty-cart {
            text-align: center;
            padding: 3rem 2rem;
            color: var(--warm-grey);
            font-size: 1rem;
        }

        /* Overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: 1500;
            display: none;
        }

        .overlay.active {
            display: block;
        }

        /* Notification */
        .notification {
            position: fixed;
            top: 100px;
            right: -300px;
            background: var(--muted-gold);
            color: white;
            padding: 0.9rem 1.8rem;
            z-index: 3000;
            font-size: 0.9rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: right 0.3s ease;
        }

        .notification.show {
            right: 30px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .products-grid {
                grid-template-columns: 1fr;
            }

            .cart-sidebar {
                width: 100%;
                right: -100%;
            }
        }
    </style>
</head>
<body>
     <!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TK4MD3L6"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
    <!-- Navigation -->
    <nav>
        <div class="logo">SERENE</div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Collection</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
            <li class="cart-icon" onclick="toggleCart()">
                🛒
                <span class="cart-count" id="cartCount">0</span>
            </li>
        </ul>
    </nav>

    <!-- Collection Section -->
    <section class="collection">
        <h2 class="section-title">Our Collection</h2>
        <p class="section-subtitle">Timeless pieces crafted with care</p>
        <div class="products-grid" id="productsGrid">
            <!-- Products will be dynamically inserted here -->
        </div>
    </section>

    <!-- Cart Sidebar -->
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h2>Shopping Cart</h2>
            <button class="close-cart" onclick="toggleCart()">✕</button>
        </div>
        <div class="cart-items" id="cartItems">
            <div class="empty-cart">Your cart is empty</div>
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cartTotal">$0.00</span>
            </div>
            <button class="checkout-btn" onclick="checkout()">Checkout</button>
        </div>
    </div>

    <!-- Overlay -->
    <div class="overlay" id="overlay" onclick="toggleCart()"></div>

    <!-- Notification -->
    <div class="notification" id="notification">Added to cart!</div>

    <script>
        // Product Data
        const products = [
            {
                id: 1,
                name: "Classic Diamond Ring",
                category: "Rings",
                price: 2850,
                image: "data:image/svg+xml,%3Csvg width='400' height='400' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='400' height='400' fill='%23F4F1EA'/%3E%3Ccircle cx='200' cy='200' r='70' fill='none' stroke='%23C9A961' stroke-width='2'/%3E%3Cpolygon points='200,160 210,180 190,180' fill='%23fff' stroke='%23C9A961' stroke-width='1'/%3E%3C/svg%3E"
            },
            {
                id: 2,
                name: "Pearl Strand Necklace",
                category: "Necklaces",
                price: 1950,
                image: "data:image/svg+xml,%3Csvg width='400' height='400' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='400' height='400' fill='%23F4F1EA'/%3E%3Cpath d='M100 200 Q200 170 300 200' stroke='%23C9A961' stroke-width='2' fill='none'/%3E%3Ccircle cx='160' cy='185' r='12' fill='%23fff' stroke='%23C9A961' stroke-width='1'/%3E%3Ccircle cx='200' cy='175' r='12' fill='%23fff' stroke='%23C9A961' stroke-width='1'/%3E%3Ccircle cx='240' cy='185' r='12' fill='%23fff' stroke='%23C9A961' stroke-width='1'/%3E%3C/svg%3E"
            },
            {
                id: 3,
                name: "Simple Hoop Earrings",
                category: "Earrings",
                price: 890,
                image: "data:image/svg+xml,%3Csvg width='400' height='400' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='400' height='400' fill='%23F4F1EA'/%3E%3Ccircle cx='140' cy='200' r='45' fill='none' stroke='%23C9A961' stroke-width='6'/%3E%3Ccircle cx='260' cy='200' r='45' fill='none' stroke='%23C9A961' stroke-width='6'/%3E%3C/svg%3E"
            },
            {
                id: 4,
                name: "Emerald Pendant",
                category: "Necklaces",
                price: 3200,
                image: "data:image/svg+xml,%3Csvg width='400' height='400' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='400' height='400' fill='%23F4F1EA'/%3E%3Cline x1='200' y1='120' x2='200' y2='180' stroke='%23C9A961' stroke-width='2'/%3E%3Crect x='185' y='180' width='30' height='40' fill='%23B4C4AE' stroke='%23C9A961' stroke-width='1'/%3E%3C/svg%3E"
            },
            {
                id: 5,
                name: "Delicate Chain Bracelet",
                category: "Bracelets",
                price: 1450,
                image: "data:image/svg+xml,%3Csvg width='400' height='400' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='400' height='400' fill='%23F4F1EA'/%3E%3Cellipse cx='200' cy='200' rx='110' ry='25' fill='none' stroke='%23C9A961' stroke-width='5'/%3E%3Ccircle cx='160' cy='200' r='6' fill='%23fff'/%3E%3Ccircle cx='200' cy='200' r='6' fill='%23fff'/%3E%3Ccircle cx='240' cy='200' r='6' fill='%23fff'/%3E%3C/svg%3E"
            },
            {
                id: 6,
                name: "Sapphire Stud Earrings",
                category: "Earrings",
                price: 1580,
                image: "data:image/svg+xml,%3Csvg width='400' height='400' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='400' height='400' fill='%23F4F1EA'/%3E%3Ccircle cx='140' cy='200' r='28' fill='%234169E1' opacity='0.3' stroke='%23C9A961' stroke-width='2'/%3E%3Ccircle cx='260' cy='200' r='28' fill='%234169E1' opacity='0.3' stroke='%23C9A961' stroke-width='2'/%3E%3C/svg%3E"
            }
        ];

        // Cart State
        let cart = [];

        // Initialize Products
        function initProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = products.map(product => `
                <div class="product-card">
                    <div class="product-image">
                        <img src="${product.image}" alt="${product.name}">
                    </div>
                    <div class="product-info">
                        <h3 class="product-name">${product.name}</h3>
                        <p class="product-category">${product.category}</p>
                        <p class="product-price">$${product.price.toLocaleString()}</p>
                        <button class="add-to-cart-btn" onclick="addToCart(${product.id})">Add to Cart</button>
                    </div>
                </div>
            `).join('');
        }

        // Add to Cart
        function addToCart(productId) {
            console.log('Adding product:', productId); // Debug log
            
            const product = products.find(p => p.id === productId);
            const existingItem = cart.find(item => item.id === productId);
            
            if (existingItem) {
                existingItem.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            
            updateCart();
            showNotification('Added to cart!');
        }

        // Remove from Cart
        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCart();
        }

        // Update Cart Display
        function updateCart() {
            const cartItems = document.getElementById('cartItems');
            const cartCount = document.getElementById('cartCount');
            const cartTotal = document.getElementById('cartTotal');
            
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            
            cartCount.textContent = totalItems;
            cartTotal.textContent = `$${totalPrice.toLocaleString()}`;
            
            if (cart.length === 0) {
                cartItems.innerHTML = '<div class="empty-cart">Your cart is empty</div>';
            } else {
                cartItems.innerHTML = cart.map(item => `
                    <div class="cart-item">
                        <div class="cart-item-image">
                            <img src="${item.image}" alt="${item.name}">
                        </div>
                        <div class="cart-item-details">
                            <div class="cart-item-name">${item.name}</div>
                            <div class="cart-item-price">$${item.price.toLocaleString()} × ${item.quantity}</div>
                            <button class="remove-item" onclick="removeFromCart(${item.id})">Remove</button>
                        </div>
                    </div>
                `).join('');
            }
        }

        // Toggle Cart
        function toggleCart() {
            const sidebar = document.getElementById('cartSidebar');
            const overlay = document.getElementById('overlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        // Checkout
        function checkout() {
            if (cart.length === 0) {
                alert('Your cart is empty');
                return;
            }
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            alert('Thank you for your order! Total: $' + total.toLocaleString());
            cart = [];
            updateCart();
            toggleCart();
        }

        // Show Notification
        function showNotification(message) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 2000);
        }

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', function() {
            console.log('Page loaded, initializing products...');
            initProducts();
            updateCart();
        });
    </script>
</body>
</html>
